baseURL = "https://f2b.0xhw.com/"
title = "f2b-api"
locale = "ja"
defaultContentLanguage = "ja"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[params]
  description = "Fail2ban の観測データを検索する公開 API。遮断ポリシー、検知条件、データの読み方を説明します。"
  displayUpdatedDate = false
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.theme]
    default = "system"
    displayToggle = true
  [params.editURL]
    enable = true
    base = "https://github.com/haturatu/f2b-api/edit/master/site/content"
  [params.page]
    width = "wide"
    displayPagination = true
  [params.footer]
    displayPoweredBy = false
    displayCopyright = false

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  name = "ポリシー"
  pageRef = "/policies"
  weight = 1
[[menu.main]]
  name = "API の使い方"
  pageRef = "/api"
  weight = 2
[[menu.main]]
  name = "API リファレンス"
  url = "/docs"
  weight = 3
[[menu.main]]
  name = "GitHub"
  url = "https://github.com/haturatu/f2b-api"
  weight = 4
  [menu.main.params]
    icon = "github"
[[menu.main]]
  name = "検索"
  weight = 5
  [menu.main.params]
    type = "search"
[[menu.main]]
  name = "テーマ"
  weight = 6
  [menu.main.params]
    type = "theme-toggle"
